[pytest]
# Put the project root on sys.path so tests can `from app.main import app`
# without installing the package.
pythonpath = .
testpaths = tests

# Silence noise from dependencies only. Nothing this project emits is
# filtered here — a warning from app/ should still be visible.
filterwarnings =
    # joblib unpickling arrays under NumPy 2.5 (one per tree in the forest)
    ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning
    # starlette's TestClient prefers httpx2; httpx works fine for now
    ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning
